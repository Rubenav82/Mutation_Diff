name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Solo Chromium: los dos proyectos de playwright.config.ts (`dev-server`
      # y `artifact`) usan el mismo navegador.
      - run: npx playwright install --with-deps chromium

      # `pretest:e2e` hace `tsc -b` y construye `packages/web/dist`: el servidor
      # de desarrollo importa `core` desde su `dist` (gitignorado) y el proyecto
      # `artifact` sirve el bundle construido, que es lo que publica la release.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
