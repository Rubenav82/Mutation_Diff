name: Release

on:
  push:
    branches: [master]
    # Un cambio solo de documentación —o de los ficheros de despliegue, que no
    # entran en el bundle— produce exactamente el mismo `dist`, así que no
    # merece una release nueva ni que la máquina interna se redescargue.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'compose/**'
  # Para republicar sin tener que tocar código.
  workflow_dispatch:

# Dos merges seguidos publican dos releases en orden, en vez de pisarse. Sin
# cancelar: cada merge a master debe acabar teniendo su artefacto.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # El resto de workflows no escriben nada; este sí, para crear la release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Se repiten aquí aunque CI también los corra sobre master: CI y Release
      # arrancan en paralelo con el mismo push, así que un CI en rojo no
      # detendría la publicación. La única forma de que esto sea una barrera de
      # verdad es que la barrera viva dentro de este workflow.
      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # `npm run build` es `tsc -b` (core + server) y NO construye el bundle de
      # web, que es `noEmit` y queda fuera del grafo de project references.
      - run: npm run build

      - run: npm run build -w web

      # El zip contiene el `dist` en su raíz (index.html + assets/), para que
      # descomprimirlo deje la carpeta lista para servir sin niveles de más.
      - name: Empaquetar el artefacto estático
        run: cd packages/web/dist && zip -r ../../../mutadiff-latest.zip .

      # Etiqueta fecha + número de ejecución: monotónica, única y sin necesidad
      # de que nadie acuerde ni suba una versión a mano. El nombre del asset se
      # mantiene fijo a propósito, porque es lo que hace que
      # `releases/latest/download/mutadiff-latest.zip` sea una URL estable.
      #
      # El `||` cubre el caso de relanzar una ejecución ya publicada, que
      # reutiliza el mismo run_number: sustituye el zip en vez de fallar.
      - name: Publicar la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          TAG="v$(date -u +%Y.%m.%d).${RUN_NUMBER}"
          gh release create "$TAG" mutadiff-latest.zip \
            --target "$SHA" \
            --title "MutaDiff $TAG" \
            --generate-notes \
            --latest \
          || gh release upload "$TAG" mutadiff-latest.zip --clobber
