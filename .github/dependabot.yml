# Actualizaciones de dependencias agrupadas (T-097), bajo demanda: se lanzan a
# mano desde Insights → Dependency graph → Dependabot → «Check for updates».
# Dependabot no admite un modo solo manual; `yearly` es el intervalo más largo
# que acepta y hace de mínimo de seguridad para que el repo no se quede años
# sin revisar. Las alertas de seguridad (Dependabot security updates) van por
# su lado y no dependen de este fichero.
#
# Minor/patch de npm llegan juntos en un PR y las acciones de GitHub en otro.
# Los cambios de versión mayor van fuera de ese grupo, que es donde hace falta
# leer el changelog antes de fusionar, con tres excepciones:
# - Vitest y sus paquetes `@vitest/*` suben de mayor juntos: por separado,
#   `@vitest/coverage-v8` N exige `vitest` N y el PR ni siquiera instala.
# - Lo mismo con Stryker: `@stryker-mutator/vitest-runner` N exige
#   `@stryker-mutator/core` N.
# - React y `react-dom` (y sus tipos) no se proponen de mayor: docs/plan.md
#   §2.1 fija React 18 y el `overrides` de package.json lo impone (T-030), así
#   que un PR de React 19 no puede pasar. Migrar es una tarea, no un bump.
#
# El monorepo usa workspaces con un único package-lock.json en la raíz, así que
# un solo directorio cubre core/server/web. `.github/**` está en el
# paths-ignore de release.yml: cambiar este fichero no dispara una release, pero
# fusionar un PR que toque package.json/package-lock.json sí.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: yearly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
      vitest:
        patterns: ['vitest', '@vitest/*']
      stryker:
        patterns: ['@stryker-mutator/*']
    ignore:
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: yearly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
    labels: [dependencies]
